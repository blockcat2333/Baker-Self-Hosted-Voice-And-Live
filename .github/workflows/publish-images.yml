name: Publish Images

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to build
        required: false
        default: main
      release_version:
        description: Optional numeric release tag, for example 1.1.0
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Classify release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "is_server_tag=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(beta([0-9]*|\.[0-9]+)?|-beta(\.[0-9]+)?)?$ ]]; then
            echo "is_server_tag=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_server_tag=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping Docker publish for non-server tag ${GITHUB_REF_NAME}."
          fi

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        if: steps.release_tag.outputs.is_server_tag == 'true'
        shell: bash
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured for image publishing."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release_tag.outputs.is_server_tag == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME }}/baker
            ghcr.io/${{ github.repository_owner }}/baker
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag' }}
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ inputs.release_version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
            type=sha

      - name: Build and push
        if: steps.release_tag.outputs.is_server_tag == 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: allinone-runtime
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        if: steps.release_tag.outputs.is_server_tag == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/baker@${IMAGE_DIGEST}"
          trap 'docker rm -fv baker-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name baker-release-smoke -e SFU_ANNOUNCED_IP=127.0.0.1 "$image" >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec baker-release-smoke /opt/baker-allinone/healthcheck.sh; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker exec baker-release-smoke supervisorctl -c /etc/baker/supervisord.conf status || true
            exit 1
          fi
          docker exec baker-release-smoke curl -fsS http://127.0.0.1/health
          docker exec baker-release-smoke curl -fsS -o /dev/null http://127.0.0.1/
          docker exec baker-release-smoke curl -fsS -o /dev/null http://127.0.0.1:8080/
