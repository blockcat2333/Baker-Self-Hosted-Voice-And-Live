name: Publish Images

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "is_server_tag=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(beta[0-9]*|-beta(\.[0-9]+)?)?$ ]]; then
            echo "is_server_tag=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_server_tag=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping Docker publish for non-server tag ${GITHUB_REF_NAME}."
          fi

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        if: steps.release_tag.outputs.is_server_tag == 'true'
        shell: bash
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured for image publishing."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: steps.release_tag.outputs.is_server_tag == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/baker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha

      - name: Build and push
        if: steps.release_tag.outputs.is_server_tag == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: allinone-runtime
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
